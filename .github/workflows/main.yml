name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential ccache git libncurses5-dev libncursesw5-dev libz-dev libssl-dev libxml2-dev libxslt1-dev libffi-dev libsqlite3-dev libbz2-dev
        sudo apt-get install -y openjdk-11-jdk
        sudo apt-get install -y zipalign apktool wget unzip
    
    - name: Manually install Android SDK
      run: |
        # Create SDK directory
        mkdir -p ~/Android/Sdk
        cd ~/Android/Sdk
        
        # Download SDK Command Line Tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip
        
        # Create tools directory structure
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/
        
        # Set SDK path
        export ANDROID_HOME=~/Android/Sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Accept licenses
        yes | sdkmanager --licenses
        
        # Install required SDK components
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
    
    - name: Set Android SDK environment variables
      run: |
        echo "ANDROID_HOME=~/Android/Sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:~/Android/Sdk/cmdline-tools/latest/bin:~/Android/Sdk/platform-tools" >> $GITHUB_ENV
    
    - name: Check project structure
      run: |
        ls -la
        cat buildozer.spec
    
    - name: Build APK
      run: |
        buildozer android debug --verbose 2>&1 | tee build.log
    
    - name: Check build results
      run: |
        ls -la
        ls -la bin/ || echo "bin directory not found"
        find . -name "*.apk" -type f || echo "No APK files found"
        cat build.log
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jersey-matcher-apk
        path: |
          bin/*.apk
          ./*.apk
        if-no-files-found: warn
    
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/**/*.log
        if-no-files-found: warn
