name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential ccache git libncurses5-dev libncursesw5-dev libz-dev libssl-dev libxml2-dev libxslt1-dev libffi-dev libsqlite3-dev libbz2-dev
        sudo apt-get install -y openjdk-11-jdk
        sudo apt-get install -y zipalign apktool
    
    - name: Build APK
      run: |
        buildozer android debug --verbose
    
    - name: Check build results
      run: |
        ls -la
        ls -la bin/ || echo "bin directory not found"
        find . -name "*.apk" || echo "No APK files found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jersey-matcher-apk
        path: |
          bin/*.apk
          ./*.apk
        if-no-files-found: error
