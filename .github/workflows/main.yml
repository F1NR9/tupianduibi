name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential ccache git libncurses5-dev libncursesw5-dev libz-dev libssl-dev libxml2-dev libxslt1-dev libffi-dev libsqlite3-dev libbz2-dev
        sudo apt-get install -y openjdk-11-jdk
        sudo apt-get install -y zipalign apktool wget unzip curl
    
    - name: Set up Android build environment
      run: |
        # Create buildozer directories
        mkdir -p ~/.buildozer/cache
        mkdir -p ~/.buildozer/android/platform
        mkdir -p ~/.buildozer/android/platform/android-sdk
        
        # Install Apache Ant
        echo "Installing Apache Ant..."
        cd ~/.buildozer/android/platform
        wget -O apache-ant-1.9.16-bin.tar.gz https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.16-bin.tar.gz
        tar xzf apache-ant-1.9.16-bin.tar.gz
        mv apache-ant-1.9.16 apache-ant-1.9.4
        
        # Install Android NDK
        echo "Installing Android NDK..."
        cd ~/.buildozer/android/platform
        wget -O android-ndk-r25c-linux.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        mv android-ndk-r25c android-ndk-r25b
        
        # Install Android SDK Command Line Tools
        echo "Installing Android SDK Command Line Tools..."
        cd ~/.buildozer/android/platform/android-sdk
        wget -O commandlinetools-linux-11076708_latest.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        
        # Create tools directory structure
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/
        
        # Set environment variables
        echo "ANDROID_HOME=~/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=~/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
        echo "ANT_HOME=~/.buildozer/android/platform/apache-ant-1.9.4" >> $GITHUB_ENV
        echo "PATH=$PATH:~/.buildozer/android/platform/apache-ant-1.9.4/bin:~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:~/.buildozer/android/platform/android-sdk/platform-tools" >> $GITHUB_ENV
    
    - name: Accept Android SDK licenses and install components
      run: |
        # Accept licenses
        echo "Accepting Android SDK licenses..."
        yes | sdkmanager --licenses
        
        # Install required SDK components
        echo "Installing SDK components..."
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
    
    - name: Configure buildozer spec
      run: |
        echo '[app]' > buildozer.spec
        echo 'title = 球衣款式匹配系统' >> buildozer.spec
        echo 'package.name = jersey_matcher' >> buildozer.spec
        echo 'package.domain = org.kivy' >> buildozer.spec
        echo 'source.dir = .' >> buildozer.spec
        echo 'source.include_exts = py,png,jpg,kv,atlas' >> buildozer.spec
        echo 'version = 0.1' >> buildozer.spec
        echo 'requirements = python3,kivy,opencv,numpy,scikit-learn,faiss-cpu,cython' >> buildozer.spec
        echo 'orientation = portrait' >> buildozer.spec
        echo 'fullscreen = 0' >> buildozer.spec
        echo 'android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, CAMERA' >> buildozer.spec
        echo 'android.archs = armeabi-v7a' >> buildozer.spec
        echo '' >> buildozer.spec
        echo '[buildozer]' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec
    
    - name: Build APK
      run: |
        buildozer android debug --verbose 2>&1 | tee build.log
    
    - name: Check build results
      run: |
        ls -la
        ls -la bin/ || echo "bin directory not found"
        find . -name "*.apk" -type f || echo "No APK files found"
        cat build.log
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jersey-matcher-apk
        path: |
          bin/*.apk
          ./*.apk
        if-no-files-found: warn
    
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/**/*.log
        if-no-files-found: warn
